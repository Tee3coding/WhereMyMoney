[project]
name = "wheremymoney"
version = "0.8.0"
description = "Personal income and expense tracker"
requires-python = ">=3.11"
dependencies = [
    "flet==1.0.5",
    "flet-charts==1.0.5",
    "flet-android-notifications==0.12.0",
]

[tool.flet]
# Name shown under the icon on your phone's home screen:
product = "WhereMyMoney"
org = "com.wheremymoney"
bundle_id = "com.wheremymoney"   # the exact app ID
company = "WhereMyMoney"
copyright = "Copyright (C) 2026 WhereMyMoney"

[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true   # for the quick-add notification

[tool.flet.app]
path = "src"